<!doctype html>
<html>

<head>
  <title>TimeFlower</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"
    integrity="sha512-E1dSFxg+wsfJ4HKjutk/WaCzK7S2wv1POn1RRPGh8ZK+ag9l244Vqxji3r6wgz9YBf6+vhQEYJZpSjqWFPg9gg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>


  <script src="https://d3js.org/d3.v7.js"></script>

  





  <script id="eventline-track-header" type="text/x-handlebars-template">

      <div>
        <span>{{heading}}</span>        
    </div>
    </script>




  <script id="track-item-template" type="text/x-handlebars-template">
        <div class="sequenceTrackItemLayout panel-1" id={{htmlId}}>
            <div class="trackItemHeading">{{name}}</div>
            <div><img alt="photograph" src="{{img}}" width="80" , height="100"/></div>
            <div>
                {{#each detailRows}}
                <h5>
                    {{this}}
                </h5>                                
                {{/each}}
            </div>
            
        </div>  
    
    </script>

  <script id="eventline-item-template" type="text/x-handlebars-template">
      <div class="sequenceTrackItemLayout  panel-1" >
        <div class="layerContainer">

          <div class="eventlineLayer">
            {{#each events}}
            <div class="eventLineEventItem" style="left:{{{eventxPos}}}; top:15px">{{eventName}}</div>                          
            {{/each}}
          </div>          
      
        
          <div class="eventlineLayer">
            <svg width="100%" height="100%">
              <g id="horizRule">
                <line stroke-width="1px" stroke="black" x1="0" x2="100%" y1="10%" y2="10%">

                </line>
              </g>
              <g id="circles">
              </g>                        
            </svg>         
          </div>
        </div>
          
      </div>

  
      </div>
        
  </script>


  <script type="module" src="src/registry.js"></script>  
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
</head>

<body>


    
  <flower-time-line target="timeline_component" id="timeLineData" start="1950-01-01" end ="1960-01-01">

    <event-flower-track type="eventline" heading="Current Affairs1" id="A">
      <event-track-item start="1959-01-01" end="2020-01-01" id="A1">        
        <event-item id="A1_1" name="VCong invade saigon" detail1="A1_1" detail2="A1_1_detail" date="1960-01-01"></event-item>        
        <event-item id="A1_2" name="event two name" detail1="A1_2" detail2="A2_1_detail" date="196-01-01"></event-item>        
       </event-track-item>
    </event-flower-track>

    <event-flower-track type="eventline" heading="Current Affairs2" id="B">
      <event-track-item start="1953-01-01" end="1958-01-01" id="B1">        
        <event-item id="B1_1" name="VCong invade saigon" detail1="B1_1" detail2="A1_1_detail" date="1954-01-01"></event-item>        
        <event-item id="B1_2" name="event two name" detail1="B1_2" detail2="B2_1_detail" date="1955-01-01"></event-item>        
       </event-track-item>
    </event-flower-track>

    <event-flower-track type="eventline" heading="Current Affairs3" id="C">
      <event-track-item start="1944-01-01" end="1952-01-01" id="C1">        
        <event-item id="C1_1" name="VCong invade saigon" detail1="C1_1" detail2="A1_1_detail" date="1944-04-01"></event-item>        
        <event-item id="C1_2" name="event two name" detail1="C1_2" detail2="C2_1_detail" date="1951-03-01"></event-item>        
       </event-track-item>
    </event-flower-track>

    <event-flower-track type="eventline" heading="Current Affairs4" id="D">
        <event-track-item start="1944-01-01" end="1949-01-01" id="D1">        
        <event-item id="D1_1" name="VCong invade saigon" detail1="D1_1" detail2="D1_1_detail" date="1944-04-01"></event-item>        
        <event-item id="D1_2" name="event two name" detail1="D1_2" detail2="D2_1_detail" date="1945-03-01"></event-item>        
       </event-track-item>
    </event-flower-track>

    <event-flower-track type="eventline" heading="Current Affairs5" id="E">
      <event-track-item start="1944-01-01" end="1962-01-01" id="E1">        
        <event-item id="E1_1" name="VCong invade saigon" detail1="E1_1" detail2="E1_1_detail" date="1944-04-01"></event-item>        
        <event-item id="E1_2" name="event two name" detail1="D1_2" detail2="D2_1_detail" date="1963-03-01"></event-item>        
       </event-track-item>
    </event-flower-track>

  </flower-time-line>


</body>
 




</html>
